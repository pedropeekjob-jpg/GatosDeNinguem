# The real site on Render (paid plans, about $20/month): public site, back office, API and Postgres.
# Set up once with New → Blueprint on render.com, then point the domain at it (docs/DEPLOY.md).
# After that every merge to main redeploys, once the GitHub checks have passed.
#
#   site         https://gatosdeninguem.pt          (www redirects to it)
#   back office  https://gestao.gatosdeninguem.pt
#   API          https://api.gatosdeninguem.pt
#
# The services also reach each other at their .onrender.com addresses, which work before and after the
# domain points here. Those assume Render kept the service names: if Render added a suffix (shown on each
# service's page), change them here and merge.

databases:
  - name: gatosdeninguem-db
    # Daily backups, kept 7 days.
    plan: basic-256mb
    region: frankfurt
    databaseName: gatos
    user: gn

services:
  - type: web
    name: gatosdeninguem-api
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: scripts/deploy/render-build.sh api
    # Migrations, and on the very first deploy the starting pages (no example cats or people).
    preDeployCommand: cd apps/api && node_modules/.bin/prisma migrate deploy && node dist/seed-db.js --if-empty --essencial
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /health
    domains:
      - api.gatosdeninguem.pt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gatosdeninguem-db
          property: connectionString
      # Optional parts, all off for now: list the ones to switch on, e.g. "patinhas,trocas,amigo"
      # (docs/funcionalidades.md). Keep the same value on the site below.
      - key: FEATURES
        value: nenhuma
      # Back office password (16+ characters). Render asks for it when the Blueprint is created.
      - key: ADMIN_TOKEN
        sync: false
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://gestao.gatosdeninguem.pt,https://gatosdeninguem-gestao.onrender.com
      - key: WEB_REVALIDATE_URL
        value: https://gatosdeninguem-site.onrender.com/api/revalidate
      # Photos are kept in Postgres, so the database backups include them.
      - key: UPLOAD_STORAGE
        value: database
      # Optional: sign-in codes by email. Without it codes are only written to the API log.
      - key: RESEND_API_KEY
        sync: false
      - key: LOGIN_EMAIL_FROM
        sync: false
      # "Contactos" form (the site shows no email address). Defaults: gatosninguem@gmail.com, copy to gatosdeninguemvc@gmail.com.
      - key: CONTACT_EMAIL_TO
        sync: false
      - key: CONTACT_EMAIL_CC
        sync: false
      # Event promotion (docs/promocao-eventos.md). Links in posts and emails point to the site.
      - key: PUBLIC_SITE_URL
        value: https://gatosdeninguem.pt
      # Uploaded photos and unsubscribe links use the API's .onrender.com address (RENDER_EXTERNAL_URL),
      # so photos added before the domain points here keep working.
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      # Optional: Facebook Page and Instagram. Without them those channels wait, marked "por ligar".
      - key: META_PAGE_ID
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_PAGE_TOKEN
        sync: false
      # Optional: "Avisem-me" notifications on visitors' devices (npx web-push generate-vapid-keys).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Optional: TikTok (the association has no account yet). Same care as above.
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REFRESH_TOKEN
        sync: false
      # Optional: godparents' monthly debit (SEPA through Stripe). Without them, the team arranges payment by hand.
      # Try with test keys (sk_test_…) first; see docs/debito-direto.md.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: gatosdeninguem-site
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: scripts/deploy/render-build.sh web
    startCommand: cd apps/web && node_modules/.bin/next start -p $PORT
    healthCheckPath: /
    # Render redirects www to the bare domain.
    domains:
      - gatosdeninguem.pt
      - www.gatosdeninguem.pt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        value: https://gatosdeninguem-api.onrender.com
      # Same as the API's FEATURES. The site reads it when it is built, so change it and redeploy.
      - key: FEATURES
        value: nenhuma
      - key: REVALIDATE_SECRET
        fromService:
          type: web
          name: gatosdeninguem-api
          envVarKey: REVALIDATE_SECRET
      # The real site: search engines may index it.
      - key: ALLOW_INDEXING
        value: "true"

  - type: web
    name: gatosdeninguem-gestao
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: scripts/deploy/render-build.sh backoffice
    staticPublishPath: apps/backoffice/dist
    domains:
      - gestao.gatosdeninguem.pt
    routes:
      # The back office is a single-page app: every address loads index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://gatosdeninguem-api.onrender.com
      - key: VITE_SITE_URL
        value: https://gatosdeninguem.pt
