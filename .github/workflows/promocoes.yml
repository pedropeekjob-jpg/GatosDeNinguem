name: Event promotions

# Free hosting puts the API to sleep, so its own 10-minute timer cannot be trusted to fire on the day.
# Every hour this asks the API to publish the approved promotions whose day has come (and wakes it up).
# Needs two repository secrets: PROMOCOES_API_URL (e.g. https://gatosdeninguem-api.onrender.com) and ADMIN_TOKEN.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish due promotions
        env:
          API_URL: ${{ secrets.PROMOCOES_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "PROMOCOES_API_URL or ADMIN_TOKEN not set: nothing to do."
            exit 0
          fi
          # A sleeping free service can take a minute to wake.
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "authorization: Bearer $ADMIN_TOKEN" "$API_URL/promocoes/correr"
